[workspace]
members = [".", "xtask"]
default-members = ["."]

[package]
name = "laptop-charge-monitor"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"
strip = "symbols"

[lib]
name = "laptop_charge_monitor"
path = "src/lib.rs"

[[bin]]
name = "laptop-charge-monitor"
path = "src/main.rs"
test = false

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
egui_plot = "0.38.0"
libloading = "0.9.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_WindowsAndMessaging",
]
